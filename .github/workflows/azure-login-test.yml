
name: Azure OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login:
    name: Verify Azure OIDC Login
    runs-on: ubuntu-24.04

    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show \
            --query "{Subscription:name,State:state}" \
            -o table
