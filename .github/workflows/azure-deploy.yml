
name: Azure Production API Deployment

on:
  workflow_dispatch:
    inputs:
      execute_deployment:
        description: "Enable Azure image push and deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write


jobs:
  prepare:
    name: Validate and Build Deployment Image
    if: ${{ !inputs.execute_deployment }}
    runs-on: ubuntu-24.04

    env:
      ACR_NAME: acrproductiondev782011
      RESOURCE_GROUP: rg-azure-production-dev
      CONTAINER_APP_NAME: ca-azure-production-api-dev
      IMAGE_NAME: azure-production-api


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      - name: Start PostgreSQL test database
        run: |
          docker run -d \
            --name ci-postgres \
            -e POSTGRES_USER=appuser \
            -e POSTGRES_PASSWORD=ci_test_password \
            -e POSTGRES_DB=testdb \
            -p 5432:5432 \
            postgres:16


          for ((i=1; i<=30; i++)); do
            echo "PostgreSQL readiness attempt $i"
            if docker exec ci-postgres pg_isready -U appuser -d testdb; then
              exit 0
            fi
            sleep 2
          done

          exit 1


      - name: Apply database migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: testdb
          PGUSER: appuser
          PGPASSWORD: ci_test_password
        run: python database/migrate.py

      - name: Run all six tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: testdb
          PGUSER: appuser
          PGPASSWORD: ci_test_password
          PYTHONPATH: app
        run: python -m pytest -v -p no:cacheprovider app/tests/

      - name: Build versioned Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./app

      - name: Deployment preparation summary
        run: |
          echo "Image: $IMAGE_NAME:${{ github.sha }}"
          echo "Deployment enabled: ${{ inputs.execute_deployment }}"
          echo "ACR: $ACR_NAME"
          echo "Container App: $CONTAINER_APP_NAME"

  deploy:
    name: Deploy to Azure Container Apps
    needs: prepare
    if: ${{ false }}
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Deployment disabled
        run: |
          echo "Azure deployment is disabled."
          echo "Infrastructure and permissions must be reviewed first."
